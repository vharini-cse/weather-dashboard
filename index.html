<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">
        <div class="container">
            <h1>Weather Dashboard</h1>
            <p>Check current weather conditions by city</p>
        </div>
    </header>


    <!-- Main Content -->
    <main class="container">

        <!-- Search Section -->
        <section class="search-section">

            <form id="weatherForm">

                <label for="cityInput">Search for a city</label>

                <div class="search-box">
                    <input
                        type="text"
                        id="cityInput"
                        placeholder="Enter city name..."
                        autocomplete="off"
                    >

                    <button type="submit" id="searchButton">
                        Search
                    </button>
                </div>

            </form>

            <!-- Error Message -->
            <p id="errorMessage" class="error-message"></p>

        </section>


        <!-- Loading Message -->
        <div id="loading" class="loading">
            Loading weather...
        </div>


        <!-- Weather Dashboard -->
        <section id="weatherContainer" class="weather-container">

            <!-- Location -->
            <div class="location">
                <h2 id="cityName">Chennai</h2>
                <p id="countryName">India</p>
            </div>


            <!-- Main Weather -->
            <div class="main-weather">

                <div class="weather-icon" id="weatherIcon">
                    ☀️
                </div>

                <div class="temperature">
                    <span id="temperature">--</span>°C
                </div>

                <p id="weatherDescription">
                    Weather condition
                </p>

            </div>


            <!-- Weather Details -->
            <div class="weather-details">

                <div class="weather-card">
                    <span class="weather-card-icon">🌡️</span>

                    <div>
                        <p>Feels Like</p>
                        <h3>
                            <span id="feelsLike">--</span>°C
                        </h3>
                    </div>
                </div>


                <div class="weather-card">
                    <span class="weather-card-icon">💧</span>

                    <div>
                        <p>Humidity</p>
                        <h3>
                            <span id="humidity">--</span>%
                        </h3>
                    </div>
                </div>


                <div class="weather-card">
                    <span class="weather-card-icon">💨</span>

                    <div>
                        <p>Wind Speed</p>
                        <h3>
                            <span id="windSpeed">--</span> km/h
                        </h3>
                    </div>
                </div>


                <div class="weather-card">
                    <span class="weather-card-icon">☀️</span>

                    <div>
                        <p>Day / Night</p>
                        <h3 id="dayStatus">
                            --
                        </h3>
                    </div>
                </div>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer class="footer">

        <p>
            Weather Dashboard • Built with HTML, CSS & JavaScript
        </p>

    </footer>


    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
